<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript Домашнее задание 35</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">
        <h2>Задание №1</h2>
        <div class="calculator">
            <div class="radius">
                Введите радиус: <input type="text" id="rad">
            </div>
            <div class="but"><button>Рассчитать</button>
            </div>
            <div class="parent">
                <div class="answers"></div>
            </div>
        </div>
    </div>
    <div class="wrap">
        <h2>Задание №2</h2>
        <h3>Площадь треугольника</h3>
        <div class="triangle">
            <div class="length">
                Введите длину основания треугольника: <input type="text" id="l">
            </div>
            <div class="height">
                Введите высоту треугольника: <input type="text" id="h">
            </div>
            <div><button class="button2">Показать результат</button></div>
            <div class="risultato">

            </div>
            <h3>Периметр треугольника</h3>
            <div class="angoli">
                Введите длину A: <input type="text" id="a">
                Введите длину B: <input type="text" id="b">
                Введите длину C: <input type="text" id="c">
            </div>
            <button class="button3">Ответ</button>

            <div class="risultato2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
