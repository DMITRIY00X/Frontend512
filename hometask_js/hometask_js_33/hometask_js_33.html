<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript Домашнее задание 33</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="modal">
        <div class="modal-content">
            <span class="close">X</span>
            <div class="header">
                <p>Вы получите подробную консультацию</p>
            </div>
            <div class="registration">
                Имя* <input type="text" class="name">
                Электронная почта* <input type="email" class="email">
                Ваш вопрос<textarea class="questions"></textarea>
                <button class="button">Отправить заявку!</button>
            </div>
        </div>
    </div>
    <div class="wrap">
        <div class="info">
            <p>Для запуска всплывающего окна нажмите на кнопку "Открыть".
                (Данные о регистрации будут видны к консоли)
            </p>
            <button id="btn">Открыть</button>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>

</html>
