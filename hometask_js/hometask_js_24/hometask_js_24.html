<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javaScript Домашнее задание 24</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">
        <div class="background">
            <h1>Подъем габаритных грузов</h1>
            <input type="text" class="floor" placeholder="Укажите этаж">

            <p>Выбирите вес груза:</p>
            <div>
                <button class="kg" data-kg="2000">до 49 кг</button>
                <button class="kg" data-kg="5000">от 50 до 99 кг</button>
                <button class="kg" data-kg="10000">от 100 до 150 кг</button>
            </div>
            <br>
            <br>
            <div class="cost">Стоимость подъема на этаж: <span class="sum"></span></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
